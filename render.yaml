# Render Blueprint: これがあると設定が全部自動になります
services:
  - type: web
    name: signal-desk
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python main.py
    envVars:
      - key: TWELVEDATA_API_KEY
        sync: false

  # 建設レンタル・廃棄物管理アプリ（rental-app/）
  # データ（記録・写真）を永続化するため、有料プラン(starter)＋永続ディスクを使う。
  # ディスクは再デプロイ・再起動でも消えないので、入力が蓄積される。
  - type: web
    name: genba-kiroku
    runtime: python
    region: singapore
    plan: starter
    rootDir: rental-app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: rental-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: RENTAL_DATA_DIR
        value: /var/data
