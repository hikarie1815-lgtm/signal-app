# Render Blueprint: これがあると設定が全部自動になります
services:
  - type: web
    name: signal-desk
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python main.py
    envVars:
      - key: TWELVEDATA_API_KEY
        sync: false

  # 建設レンタル・廃棄物管理アプリ（rental-app/）
  # データは Firebase(Storage) に永続化するので、Render は無料プランでよい。
  # 起動時に Firebase から data.db と写真を復元し、変更のたびに保存する。
  - type: web
    name: genba-kiroku
    runtime: python
    region: singapore
    plan: free
    rootDir: rental-app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Firebase Storage のバケット名（例: genba-kiroku.appspot.com）
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      # サービスアカウントJSONの中身をそのまま貼る（ダッシュボードで設定）
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # ダーツリーグ 対戦表・スコアシートアプリ（darts-app/）
  # データは SQLite。Firebase を設定すれば無料プランでも消えない。
  - type: web
    name: ki-league
    runtime: python
    region: singapore
    plan: free
    rootDir: darts-app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 任意: Firebase Storage に自動バックアップしたいときだけ設定する
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: DARTS_CLOUD_PATH
        value: darts/darts.db
